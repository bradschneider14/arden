# First-run clearing world definition (Ticket #20).
# Objects are defined purely by physical properties and hidden behavior rules.
# Human-readable names live only in `creator_label` for the observer log / UI
# and are never exposed to agent perception.

[body]
position = { x = 5.5, y = 7.5 }
level = "ground"
energy = 1.0
comfort = 1.0

[terrain]
width = 16
height = 16
tile_size = 1.0
default_type = "grass"

# Stream along the eastern side of the clearing, flowing south -> north (+y).
[[terrain.regions]]
x0 = 11
y0 = 0
x1 = 12
y1 = 15
type = "water"
flow = { x = 0.0, y = 1.0 }

# Raised rock ledge in the northwest corner (elevation 1.0m, out of reach from ground).
[[terrain.regions]]
x0 = 1
y0 = 12
x1 = 3
y1 = 14
type = "ledge"

# --- Large trees (tall, fixed, shade) ---
[[objects]]
id = "object_1"
creator_label = "large_tree_north"
position = { x = 4.0, y = 9.5 }
level = "ground"
shape = "cylinder"
height = 3.5
volume = 0.60
weight = 120.0
rigidity = 0.95
fixed = true
color = "brown"
state = { shade = true, wet = false }


# First-run clearing world definition (docs/DESIGN.md Section 8).
# Objects are defined purely from physical properties and hidden verb rules.
# `creator_label` is metadata for the web client and observer log only and is
# never exposed to agent perception.

[body]
position = { x = 6.5, y = 6.5 }
level = "ground"
energy = 1.0
comfort = 1.0

[terrain]
width = 16
height = 16
tile_size = 1.0
default_type = "grass"

# Stream along the northern edge separating the meadow (y = 0..11) from the far bank (y = 13..15).
[[terrain.regions]]
x0 = 0
y0 = 12
x1 = 15
y1 = 12
type = "water"
flow = { x = 1.0, y = 0.0 }

# Raised rock ledge (elevation 1.0m) in the western clearing.
[[terrain.regions]]
x0 = 1
y0 = 5
x1 = 2
y1 = 8
type = "ledge"


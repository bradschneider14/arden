# Copy to arden.toml to override defaults. A missing arden.toml uses these values.

[world]
# Simulation ticks per real-time second.
tick_rate = 10.0
# Seed for the single simulation RNG.
seed = 0

[perception]
# Base sensing radius in world units (meters).
sensing_radius = 10.0
# Reach distance for interacting with objects and their affordances.
reach_radius = 1.5
# Minimum distance an object must move to report a movement delta.
move_threshold = 0.1
# Visibility factor at or below which fine detail such as color is dropped.
color_visibility_threshold = 0.75

[daynight]
# Length of a full day/night cycle in simulation ticks.
day_length = 600
# Fraction of the cycle that is daytime.
daylight_share = 0.5
# Sensing radius at darkest night as a fraction of the daytime radius.
min_visibility = 0.25
# How much colder midnight is than noon.
temperature_swing = 0.4
# Peak daytime ambient temperature at noon.
base_temperature = 1.0

[body]
# Preset for body side-effect strengths and drain rates: "default", "gentle", or "harsh".
preset = "default"
# Passive per-tick energy drain.
energy_time_drain = 0.002
# Base energy drain per active verb (scaled by verb weight and force).
energy_activity_drain = 0.02
# Per-tick energy restored while resting (idle).
energy_rest_recovery = 0.015
# Default energy restored when eating an object with an edible rule.
edible_energy_restore = 0.15
# Energy level below which gradual speed and force side effects begin.
low_energy_effect_threshold = 0.95
# Per-tick comfort drain from cold, wet, night, storm, and low energy.
comfort_cold_drain = 0.018
comfort_wet_drain = 0.018
comfort_night_drain = 0.012
comfort_storm_drain = 0.028
comfort_low_energy_drain = 0.02
# Per-tick comfort recovery from shelter, dryness, warmth, and rest.
comfort_shelter_recovery = 0.015
comfort_dry_recovery = 0.005
comfort_warm_recovery = 0.006
comfort_rest_recovery = 0.015
# Physical side-effect strengths (low energy -> speed/force, cold -> grab/bind, wet -> speed/slip, low comfort -> sensing).
low_energy_speed_effect = 0.4
low_energy_force_effect = 0.45
cold_grab_fail_effect = 0.35
cold_bind_fail_effect = 0.35
wet_speed_effect = 0.2
wet_slip_effect = 0.25
low_comfort_sensing_effect = 0.4
very_low_comfort_threshold = 0.35
# Intrinsic drive rates and attention-gate wake thresholds.
boredom_rise_rate = 0.02
boredom_drop_scale = 0.5
curiosity_novelty_weight = 0.3
curiosity_surprise_weight = 0.5
low_energy_wake_threshold = 0.25
low_comfort_wake_threshold = 0.25
boredom_wake_threshold = 0.7
curiosity_wake_threshold = 0.6

[weather]
# Seed for the automated weather RNG.
seed = 0
# Length of one in-world hour in simulation ticks.
ticks_per_hour = 25
# Whether automated weather transitions are paused.
paused = false

[weather.chance]
clear = 0.45
rain = 0.3
wind = 0.25
cold = 0.2
storm = 0.15

[weather.duration]
clear = [60, 150]
rain = [40, 100]
wind = [30, 90]
cold = [40, 100]
storm = [25, 70]

[weather.intensity]
clear = [0.0, 0.0]
rain = [0.25, 0.85]
wind = [0.25, 0.85]
cold = [0.25, 0.85]
storm = [0.5, 1.0]

[weather.transitions]
clear = ["rain", "wind", "cold"]
rain = ["clear", "wind", "cold", "storm"]
wind = ["clear", "rain", "cold", "storm"]
cold = ["clear", "rain", "wind", "storm"]
storm = ["rain", "wind", "cold", "clear"]

[memory]
# Maximum number of entries in the short-term buffer before reflection is triggered.
buffer_size = 40
# Consecutive idle (rest) ticks before reflection is triggered.
rest_idle_ticks = 10
# Path to the SQLite episodic memory database.
db_path = "data/memory.db"
# Per-tick salience decay rate for unrecalled episodes.
decay_rate = 0.005
# Minimum salience floor below which episodes are forgotten (deleted).
salience_floor = 0.1
# Salience boost applied when an episode is recalled.
recall_boost = 0.15
# Salience boost weight for discomfort (1 - comfort).
discomfort_salience_boost = 0.25
# Salience boost weight for surprise.
surprise_salience_boost = 0.35
# Hard cap on semantic beliefs before evicting the lowest confidence * recency belief.
max_beliefs = 32
# Default initial confidence for newly proposed semantic beliefs.
initial_belief_confidence = 0.5
# Confidence boost when a reflection observation supports an existing belief.
belief_support_delta = 0.15
# Confidence drop when a reflection observation contradicts an existing belief.
belief_contradict_delta = 0.2
# Per-tick recency decay rate for belief eviction and memory retrieval scoring.
recency_decay_rate = 0.01
# Maximum word count for the agent's self-model rewritten during reflection.
max_self_model_words = 80
# Default number of top memories (episodes and beliefs) retrieved for prompts.
retrieval_k = 5
[gate]
# Periodic heartbeat interval in simulation ticks (chosen to over-wake).
heartbeat_interval = 30
# Surprise score threshold in [0.0, 1.0] (0 until T16 supplies scores).
surprise_threshold = 0.25
# Body energy threshold at or below which the gate wakes the LLM.
low_energy_threshold = 0.3
# Body comfort threshold at or below which the gate wakes the LLM.
low_comfort_threshold = 0.3
# Boredom drive threshold at or above which the gate wakes the LLM.
boredom_threshold = 0.5
# Minimum movement delta in meters for `<id> moves` / `<id> stops moving` conditions.
move_threshold = 0.05

[surprise]
# Whether expectation surprise falls back to an LLM judge call when the cheap movement check is inconclusive.
use_llm_judge = false
# Initial per-context running average of prediction error (`usual_error(context)`).
initial_usual_error = 0.1
# Floor on `usual_error(context)` to prevent division by zero.
min_usual_error = 0.1
# Exponential moving average update rate for `usual_error(context)`.
error_ema_alpha = 0.25
# Decay factor in (0.0, 1.0] applied on each repeated identical surprise (`habituation_decay ** count`).
habituation_decay = 0.65
# Persistent pull value stored on an object id when a surprise remains unexplained after reflection.
unexplained_pull = 0.2
# Position/displacement tolerance in meters for the cheap expectation movement check.
movement_tolerance = 0.25

[mailbox]
# Probability in [0.0, 1.0] per in-game hour that a closed mailbox lid swings open on its own.
lid_drift_chance = 0.0
# Simulated time delay in seconds before captured speech in an open mailbox is delivered if the lid stays open.
delivery_delay_s = 10.0
# Path to the SQLite creator inbox and mail audit log database.
db_path = "data/mailbox.db"

[llm]
# Backend name: "mock" (default), "ollama", or "openai_compat" / "llama_cpp".
backend = "mock"
# OpenAI-compatible base URL (Ollama /v1 or llama.cpp server).
base_url = "http://127.0.0.1:11434/v1"
# Model identifier for the local backend.
model = "qwen2.5:7b-instruct"
# Sampling temperature for structured generation.
temperature = 0.2
# Default HTTP timeout in seconds for a single LLM request.
timeout_s = 30.0
# Number of repair retries when the LLM returns invalid JSON or fails schema validation.
max_retries = 2

[logging]
# Process log level. Separate from the observer log.
level = "INFO"
